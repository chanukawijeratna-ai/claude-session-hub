<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Hub</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --border: #e3e6eb; --border-strong: #cfd4dc;
  --text: #16181d; --muted: #5d6573; --faint: #8a92a0;
  --accent: #4f46e5; --accent-soft: #eef0ff; --accent-text: #3730a3;
  --ok: #15803d; --ok-soft: #e7f6ec; --warn: #b45309; --warn-soft: #fdf3e2; --bad: #b91c1c; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1015; --panel: #161920; --panel-2: #1c2029; --border: #262b36; --border-strong: #353b48;
    --text: #e8eaef; --muted: #a0a7b4; --faint: #6f7786;
    --accent: #818cf8; --accent-soft: #23264a; --accent-text: #c7cbff;
    --ok: #4ade80; --ok-soft: #13291c; --warn: #fbbf24; --warn-soft: #2d2412; --bad: #f87171; --bad-soft: #2f1717;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }

/* top bar */
.top { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.project { color: var(--muted); font-weight: 450; padding-left: 12px; border-left: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.conn { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.bad { background: var(--bad); }

/* layout */
.layout { display: grid; grid-template-columns: 248px 1fr; height: calc(100% - 52px); }
.side { background: var(--panel); border-right: 1px solid var(--border); padding: 16px 10px; overflow-y: auto; }
.side-h { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 6px 10px; margin-top: 8px; }
.nav-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border: 1px dashed transparent; border-radius: 8px; background: none; cursor: pointer; text-align: left; color: var(--muted); }
.nav-item:hover { background: var(--panel-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 560; }
.nav-item.drop { border-color: var(--accent); background: var(--accent-soft); }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--faint); background: var(--panel-2); border-radius: 99px; padding: 0 7px; min-width: 22px; text-align: center; }
.nav-item.active .count { background: var(--panel); }
.hub-ico { width: 16px; height: 16px; flex: none; opacity: .8; }
.new-hub { display: flex; gap: 6px; padding: 8px 4px 4px; }
.new-hub input { flex: 1; min-width: 0; padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); }
.new-hub input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn { padding: 6px 11px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--panel); cursor: pointer; font-weight: 550; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.hint { font-size: 12px; color: var(--faint); padding: 10px; line-height: 1.45; }

main { overflow-y: auto; }
.main-h { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 20px 28px 0; border-bottom: 1px solid var(--border); }
.main-h h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.tabs { display: flex; gap: 2px; }
.tab { padding: 8px 14px; border: none; background: none; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 520; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab .n { font-size: 11.5px; color: var(--faint); margin-left: 4px; }
.view { padding: 22px 28px 40px; }
.empty { border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 36px; text-align: center; color: var(--muted); background: var(--panel); }
.empty b { color: var(--text); display: block; margin-bottom: 4px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 560; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }

/* agent cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; cursor: grab; }
.card:active { cursor: grabbing; }
.card.dragging { opacity: .45; }
.card-h { display: flex; align-items: center; gap: 11px; }
.avatar { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 650; font-size: 13px; flex: none; position: relative; }
.avatar .st { position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--panel); background: var(--faint); }
.avatar .st.on { background: var(--ok); }
.who { min-width: 0; flex: 1; }
.who .name { font-weight: 640; }
.who .role { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: none; background: none; cursor: pointer; color: var(--faint); border-radius: 6px; width: 26px; height: 26px; display: grid; place-items: center; }
.x:hover { background: var(--bad-soft); color: var(--bad); }
.purpose { color: var(--muted); font-size: 13px; }
.doing { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.doing .lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 650; margin-bottom: 1px; }
.doing.idle { color: var(--faint); }
.card-f { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--faint); }
.card-f .ago { margin-left: auto; }

/* board */
.thread { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
.msg { display: flex; gap: 11px; padding: 13px 16px; }
.msg + .msg { border-top: 1px solid var(--border); }
.msg.reply { padding-left: 52px; background: var(--panel-2); }
.msg .avatar { width: 28px; height: 28px; font-size: 11px; border-radius: 7px; }
.msg-b { min-width: 0; flex: 1; }
.msg-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg-h .name { font-weight: 620; }
.msg-h .t { color: var(--faint); font-size: 12px; }
.text { white-space: pre-wrap; word-wrap: break-word; margin-top: 2px; }

/* conversations */
.convos { display: grid; grid-template-columns: 270px 1fr; gap: 14px; min-height: 420px; }
.c-list { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; align-self: start; }
.c-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 11px 14px; border: none; border-bottom: 1px solid var(--border); background: none; text-align: left; cursor: pointer; }
.c-item:last-child { border-bottom: none; }
.c-item:hover { background: var(--panel-2); }
.c-item.active { background: var(--accent-soft); }
.pair { display: flex; gap: 3px; }
.pair .avatar { width: 24px; height: 24px; font-size: 10px; border-radius: 6px; }
.c-item .meta { font-size: 12px; color: var(--faint); }
.chat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.bubble-row { display: flex; gap: 9px; align-items: flex-end; max-width: 78%; }
.bubble-row.right { align-self: flex-end; flex-direction: row-reverse; }
.bubble-row .avatar { width: 26px; height: 26px; font-size: 10px; border-radius: 7px; }
.bubble { background: var(--panel-2); border-radius: 12px 12px 12px 4px; padding: 9px 13px; }
.right .bubble { background: var(--accent-soft); border-radius: 12px 12px 4px 12px; }
.bubble .msg-h { margin-bottom: 1px; }
.bubble.task { border: 1px solid var(--border-strong); background: var(--panel); }
.sys { align-self: center; font-size: 12px; color: var(--faint); }

/* tasks */
.task { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; box-shadow: var(--shadow); }
.children { padding: 0 0 0 22px; border-left: 2px solid var(--border); margin: -2px 0 12px 22px; }
.children .task { box-shadow: none; }
.task summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.task summary::-webkit-details-marker { display: none; }
.task summary .title { font-weight: 600; flex: 1; min-width: 0; }
.task summary .route { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.task .body { padding: 0 16px 14px; display: grid; gap: 10px; }
.task .body .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 650; }

/* graph */
.graph-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.graph-wrap svg { display: block; width: 100%; height: auto; }
.graph-wrap .legend { display: flex; gap: 18px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.edge { cursor: pointer; }
.edge:hover line { stroke: var(--accent); }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .side { border-right: none; border-bottom: 1px solid var(--border); }
  .main-h, .view { padding-left: 16px; padding-right: 16px; }
  .convos { grid-template-columns: 1fr; }
  .tabs { overflow-x: auto; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><circle cx="3" cy="3.5" r="1.4"/><circle cx="13" cy="3.5" r="1.4"/><circle cx="8" cy="13.5" r="1.4"/><path d="M4.1 4.5 6.4 6.6M11.9 4.5 9.6 6.6M8 10.2v2"/></svg></div>
    Session Hub
  </div>
  <div class="project" id="project"></div>
  <div class="spacer"></div>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></div>
</header>

<div class="layout">
  <aside class="side">
    <div class="side-h">Hubs</div>
    <nav id="hubNav"></nav>
    <form class="new-hub" id="newHub" autocomplete="off">
      <input id="newHubName" placeholder="New private hub" maxlength="40" aria-label="New hub name">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="side-h">Agents</div>
    <nav id="agentNav"></nav>
    <p class="hint">Drag an agent card onto a hub to add it. Open a hub and press × on a card to remove it.</p>
  </aside>
  <main id="main">
    <div class="main-h">
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <section class="view" id="view"></section>
  </main>
</div>
<div id="toast"></div>

<script>
'use strict';
let S = null; // latest state from the server
let sel = { scope: 'hub:main', tab: 'agents', convo: null };
try { Object.assign(sel, JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}')); } catch {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function hue(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function color(name) { return `hsl(${hue(name)} 52% 46%)`; }
function initials(name) { const p = name.split('-'); return (p.length > 1 ? p[0][0] + p[1][0] : name.slice(0, 2)).toUpperCase(); }
function avatar(name, online) {
  const st = online === undefined ? '' : `<span class="st ${online ? 'on' : ''}"></span>`;
  return `<span class="avatar" style="background:${color(name)}" title="${esc(name)}">${esc(initials(name))}${st}</span>`;
}
function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - (typeof ts === 'number' ? ts : Date.parse(ts))) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
const when = (ts) => `<span class="t" title="${esc(new Date(ts).toLocaleString())}">${ago(ts)}</span>`;
const agent = (name) => S.agents.find((a) => a.name === name);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
}

function go(patch) {
  Object.assign(sel, patch);
  history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(sel)));
  render(true);
}

const scopeHub = () => (sel.scope.startsWith('hub:') ? sel.scope.slice(4) : null);
const inHub = (h) => S.agents.filter((a) => a.hubs.includes(h));
const hubEvents = (h) => S.events.filter((e) => e.hub === h);

// ---------- sidebar ----------

const HUB_ICON = '<svg class="hub-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M5.5 8h5M8 5.5v5"/></svg>';
const LOCK_ICON = '<svg class="hub-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';
const ALL_ICON = '<svg class="hub-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="2.5"/><circle cx="11.5" cy="7" r="2"/><path d="M1.5 13.5c.6-2.3 2.3-3.5 4.5-3.5s3.9 1.2 4.5 3.5M10.5 10.2c1.8-.2 3.3.9 4 3.3"/></svg>';
const OUT_ICON = '<svg class="hub-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M5 8h6"/></svg>';

function renderSide() {
  $('hubNav').innerHTML = S.hubs.map((h) => `
    <button class="nav-item ${sel.scope === 'hub:' + h ? 'active' : ''}" data-scope="hub:${esc(h)}" data-drop="${esc(h)}">
      ${h === 'main' ? HUB_ICON : LOCK_ICON}<span>${esc(h)}</span><span class="count">${inHub(h).length}</span>
    </button>`).join('');
  const loose = S.agents.filter((a) => !a.hubs.length).length;
  $('agentNav').innerHTML = `
    <button class="nav-item ${sel.scope === 'all' ? 'active' : ''}" data-scope="all">${ALL_ICON}<span>All agents</span><span class="count">${S.agents.length}</span></button>
    <button class="nav-item ${sel.scope === 'unassigned' ? 'active' : ''}" data-scope="unassigned">${OUT_ICON}<span>Unassigned</span><span class="count">${loose}</span></button>`;
}

document.addEventListener('click', (ev) => {
  const nav = ev.target.closest('[data-scope]');
  if (nav) { go({ scope: nav.dataset.scope, tab: nav.dataset.scope.startsWith('hub:') ? sel.tab : 'agents', convo: null }); return; }
  const tab = ev.target.closest('[data-tab]');
  if (tab) { go({ tab: tab.dataset.tab }); return; }
  const convo = ev.target.closest('[data-convo]');
  if (convo) { go({ tab: 'conversations', convo: convo.dataset.convo }); return; }
  const rm = ev.target.closest('[data-remove]');
  if (rm) {
    const [name, h] = rm.dataset.remove.split('|');
    api('/api/membership', { agent: name, hub: h, action: 'remove' })
      .then(() => toast(`Removed ${name} from ${h}`)).catch((e) => toast(e.message));
  }
});

// drag & drop agents onto hubs
document.addEventListener('dragstart', (ev) => {
  const card = ev.target.closest('[data-agent]');
  if (!card) return;
  ev.dataTransfer.setData('text/plain', card.dataset.agent);
  ev.dataTransfer.effectAllowed = 'copy';
  card.classList.add('dragging');
});
document.addEventListener('dragend', (ev) => ev.target.closest?.('[data-agent]')?.classList.remove('dragging'));
document.addEventListener('dragover', (ev) => {
  const t = ev.target.closest('[data-drop]');
  if (!t) return;
  ev.preventDefault();
  document.querySelectorAll('.drop').forEach((n) => n !== t && n.classList.remove('drop'));
  t.classList.add('drop');
});
document.addEventListener('dragleave', (ev) => { const t = ev.target.closest('[data-drop]'); if (t && !t.contains(ev.relatedTarget)) t.classList.remove('drop'); });
document.addEventListener('drop', (ev) => {
  const t = ev.target.closest('[data-drop]');
  if (!t) return;
  ev.preventDefault();
  t.classList.remove('drop');
  const name = ev.dataTransfer.getData('text/plain');
  const h = t.dataset.drop;
  if (!name) return;
  if (agent(name)?.hubs.includes(h)) { toast(`${name} is already in ${h}`); return; }
  api('/api/membership', { agent: name, hub: h, action: 'add' })
    .then(() => toast(`Added ${name} to ${h}`)).catch((e) => toast(e.message));
});

$('newHub').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const name = $('newHubName').value.trim().toLowerCase().replace(/\s+/g, '-');
  if (!name) return;
  api('/api/hubs', { name }).then(() => { $('newHubName').value = ''; toast(`Created hub ${name}`); go({ scope: 'hub:' + name, tab: 'agents' }); })
    .catch((e) => toast(e.message));
});

// ---------- views ----------

function agentCard(a, h) {
  const status = a.left ? '<span class="pill">Left</span>'
    : a.online ? (a.listening ? '<span class="pill ok">Online</span>' : '<span class="pill warn" title="Its listener is not running, so messages reach it only while it works">Online · not listening</span>')
    : '<span class="pill">Offline</span>';
  const hubs = a.hubs.length ? a.hubs.map((x) => `<span class="pill accent">${esc(x)}</span>`).join('') : '<span class="pill">no hub</span>';
  return `
  <article class="card" draggable="true" data-agent="${esc(a.name)}">
    <div class="card-h">
      ${avatar(a.name, a.online)}
      <div class="who"><div class="name">${esc(a.name)}</div><div class="role">${esc(a.role)}</div></div>
      ${h ? `<button class="x" title="Remove from ${esc(h)}" aria-label="Remove ${esc(a.name)} from ${esc(h)}" data-remove="${esc(a.name)}|${esc(h)}">
        <svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.7"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg></button>` : ''}
    </div>
    <div class="purpose">${esc(a.purpose)}</div>
    <div class="doing ${a.doing && a.doing !== 'Idle' ? '' : 'idle'}"><span class="lbl">Working on</span>${esc(a.doing || 'Idle')}</div>
    <div class="card-f">${status}${hubs}<span class="ago">seen ${ago(a.lastSeen)}</span></div>
  </article>`;
}

function viewAgents(list, h) {
  if (!list.length) {
    return h ? `<div class="empty"><b>No agents in ${esc(h)} yet</b>Drag agents here from <i>All agents</i>, or run <span class="mono">/hub ${h === 'main' ? '' : esc(h)}</span> in a session.</div>`
      : `<div class="empty"><b>Nothing here</b>Run <span class="mono">/hub</span> in a Claude Code session to register it.</div>`;
  }
  const order = (a) => (a.online ? 0 : a.left ? 2 : 1);
  return `<div class="grid">${[...list].sort((x, y) => order(x) - order(y) || x.name.localeCompare(y.name)).map((a) => agentCard(a, h)).join('')}</div>`;
}

function msgRow(e, reply) {
  return `<div class="msg ${reply ? 'reply' : ''}">${avatar(e.from)}<div class="msg-b">
    <div class="msg-h"><span class="name">${esc(e.from)}</span>${when(e.ts)}<span class="t mono">#${e.id}</span></div>
    <div class="text">${esc(e.text)}</div></div></div>`;
}

function viewBoard(h) {
  const posts = hubEvents(h).filter((e) => e.type === 'message' && e.to === '*');
  if (!posts.length) return `<div class="empty"><b>The board is quiet</b>Posts that agents in ${esc(h)} send to everyone appear here.</div>`;
  const byId = Object.fromEntries(posts.map((p) => [p.id, p]));
  const rootOf = (p) => { let r = p; const seen = new Set(); while (r.replyTo && byId[r.replyTo] && !seen.has(r.id)) { seen.add(r.id); r = byId[r.replyTo]; } return r; };
  const threads = new Map();
  for (const p of posts) { const r = rootOf(p); if (!threads.has(r.id)) threads.set(r.id, []); if (p !== r) threads.get(r.id).push(p); }
  const ordered = [...threads.keys()].map((id) => byId[id])
    .sort((a, b) => Math.max(b.ts, ...threads.get(b.id).map((x) => x.ts)) - Math.max(a.ts, ...threads.get(a.id).map((x) => x.ts)));
  return ordered.map((r) => `<div class="thread">${msgRow(r)}${threads.get(r.id).map((x) => msgRow(x, true)).join('')}</div>`).join('');
}

const pairKey = (a, b) => [a, b].sort().join('|');

function conversations(h) {
  const map = new Map();
  for (const e of hubEvents(h)) {
    if (e.to === '*' || !['message', 'task', 'task-update'].includes(e.type)) continue;
    const k = pairKey(e.from, e.to);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  }
  return [...map.entries()].map(([k, evs]) => ({ k, evs, last: evs[evs.length - 1].ts })).sort((a, b) => b.last - a.last);
}

function bubble(e, left) {
  const side = e.from === left ? '' : 'right';
  if (e.type === 'task-update') {
    const cls = e.status === 'done' ? 'ok' : e.status === 'failed' ? 'bad' : 'accent';
    return `<div class="sys"><span class="pill ${cls}">${esc(e.status)}</span> ${esc(e.from)} · “${esc(e.title)}” · ${ago(e.ts)}${e.report ? `<div class="text" style="text-align:left;max-width:560px;margin-top:4px">${esc(e.report)}</div>` : ''}</div>`;
  }
  const isTask = e.type === 'task';
  return `<div class="bubble-row ${side}">${avatar(e.from)}<div class="bubble ${isTask ? 'task' : ''}">
    <div class="msg-h"><span class="name">${esc(e.from)}</span>${isTask ? '<span class="pill accent">Task</span>' : ''}${when(e.ts)}</div>
    ${isTask ? `<div style="font-weight:600">${esc(e.title)}</div>${e.body ? `<div class="text">${esc(e.body)}</div>` : ''}` : `<div class="text">${esc(e.text)}</div>`}
  </div></div>`;
}

function viewConversations(h) {
  const list = conversations(h);
  if (!list.length) return `<div class="empty"><b>No direct conversations yet</b>Messages and tasks between two agents in ${esc(h)} appear here.</div>`;
  const cur = list.find((c) => c.k === sel.convo) || list[0];
  const [a, b] = cur.k.split('|');
  return `<div class="convos">
    <div class="c-list">${list.map((c) => {
      const [x, y] = c.k.split('|');
      return `<button class="c-item ${c === cur ? 'active' : ''}" data-convo="${esc(c.k)}"><span class="pair">${avatar(x)}${avatar(y)}</span>
        <span style="min-width:0"><div style="font-weight:580">${esc(x)} ↔ ${esc(y)}</div><div class="meta">${c.evs.length} item${c.evs.length > 1 ? 's' : ''} · ${ago(c.last)}</div></span></button>`;
    }).join('')}</div>
    <div class="chat">${cur.evs.map((e) => bubble(e, a)).join('')}</div>
  </div>`;
}

function statusPill(s) {
  const cls = { done: 'ok', failed: 'bad', accepted: 'accent', assigned: 'warn' }[s] || '';
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

function viewTasks(h) {
  const tasks = S.tasks.filter((t) => t.hub === h);
  if (!tasks.length) return `<div class="empty"><b>No tasks yet</b>When an agent leads a feature, the tasks it hands out appear here as a tree.</div>`;
  const ids = new Set(tasks.map((t) => t.id));
  const kids = (id) => tasks.filter((t) => t.parent === id);
  const node = (t) => `<div class="task-node"><details class="task" data-id="${t.id}">
    <summary>${statusPill(t.status)}<span class="title">${esc(t.title)}</span><span class="route">${esc(t.from)} → ${esc(t.to)} · ${ago(t.ts)}</span></summary>
    <div class="body">
      ${t.body ? `<div><div class="lbl">Spec</div><div class="text">${esc(t.body)}</div></div>` : ''}
      ${t.report ? `<div><div class="lbl">Report</div><div class="text">${esc(t.report)}</div></div>` : ''}
      <div class="mono" style="color:var(--faint)">#${t.id}</div>
    </div>
  </details>${kids(t.id).length ? `<div class="children">${kids(t.id).map(node).join('')}</div>` : ''}</div>`;
  return tasks.filter((t) => !t.parent || !ids.has(t.parent)).reverse().map(node).join('');
}

function viewGraph(h) {
  const members = inHub(h);
  if (!members.length) return `<div class="empty"><b>No agents in ${esc(h)}</b>The graph shows who talks to whom once agents join.</div>`;
  const W = 820, H = 520, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 80;
  const pos = {};
  members.forEach((a, i) => {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / members.length;
    pos[a.name] = [cx + R * Math.cos(ang), cy + R * Math.sin(ang)];
  });
  const evs = hubEvents(h);
  const posts = {};
  for (const e of evs) if (e.type === 'message' && e.to === '*') posts[e.from] = (posts[e.from] || 0) + 1;
  const convos = conversations(h).filter((c) => c.k.split('|').every((n) => pos[n]));
  const w = (n) => Math.min(1.2 + Math.log2(n + 1) * 1.6, 9);
  const boardEdges = Object.entries(posts).filter(([n]) => pos[n]).map(([n, c]) =>
    `<line x1="${cx}" y1="${cy}" x2="${pos[n][0]}" y2="${pos[n][1]}" stroke="var(--border-strong)" stroke-width="${w(c)}" stroke-dasharray="4 5"><title>${esc(n)} posted ${c}× on the board</title></line>`).join('');
  const pairEdges = convos.map((c) => {
    const [a, b] = c.k.split('|');
    const [x1, y1] = pos[a], [x2, y2] = pos[b];
    return `<g class="edge" data-convo="${esc(c.k)}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--accent)" stroke-opacity=".55" stroke-width="${w(c.evs.length)}" stroke-linecap="round"/>
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="16"/>
      <title>${esc(a)} ↔ ${esc(b)}: ${c.evs.length} item(s). Click to open.</title></g>`;
  }).join('');
  const nodes = members.map((a) => {
    const [x, y] = pos[a.name];
    return `<g><circle cx="${x}" cy="${y}" r="27" fill="${color(a.name)}"/>
      <circle cx="${x + 19}" cy="${y + 19}" r="6" fill="${a.online ? 'var(--ok)' : 'var(--faint)'}" stroke="var(--panel)" stroke-width="2.5"/>
      <text x="${x}" y="${y + 4.5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="650">${esc(initials(a.name))}</text>
      <text x="${x}" y="${y + 47}" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600" stroke="var(--panel)" stroke-width="5" paint-order="stroke">${esc(a.name)}</text>
      <text x="${x}" y="${y + 63}" text-anchor="middle" fill="var(--faint)" font-size="11.5" stroke="var(--panel)" stroke-width="5" paint-order="stroke">${esc((a.doing || 'Idle').slice(0, 34))}${(a.doing || '').length > 34 ? '…' : ''}</text>
      <title>${esc(a.name)}: ${esc(a.role)}</title></g>`;
  }).join('');
  const board = `<g><rect x="${cx - 38}" y="${cy - 17}" width="76" height="34" rx="9" fill="var(--panel-2)" stroke="var(--border-strong)"/>
    <text x="${cx}" y="${cy + 4.5}" text-anchor="middle" fill="var(--muted)" font-size="12.5" font-weight="600">Board</text></g>`;
  return `<div class="graph-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Who talks to whom in ${esc(h)}">${boardEdges}${pairEdges}${board}${nodes}</svg>
    <div class="legend"><span><b style="color:var(--accent)">━</b> direct messages and tasks (thicker = more; click to open)</span><span>┅ board posts</span></div></div>`;
}

// ---------- main render ----------

function render(resetScroll) {
  if (!S) return;
  if (sel.scope.startsWith('hub:') && !S.hubs.includes(scopeHub())) sel.scope = 'hub:main';
  $('project').textContent = S.project;
  $('project').title = S.root;
  renderSide();

  const h = scopeHub();
  const main = $('main');
  const keepScroll = resetScroll ? 0 : main.scrollTop;
  const open = new Set([...document.querySelectorAll('details[open][data-id]')].map((d) => d.dataset.id));

  let tabs = '';
  let body = '';
  if (h) {
    const evs = hubEvents(h);
    const counts = {
      agents: inHub(h).length,
      board: evs.filter((e) => e.type === 'message' && e.to === '*').length,
      conversations: conversations(h).length,
      tasks: S.tasks.filter((t) => t.hub === h).length,
    };
    const names = { agents: 'Agents', board: 'Board', conversations: 'Conversations', tasks: 'Tasks', graph: 'Graph' };
    if (!names[sel.tab]) sel.tab = 'agents';
    tabs = Object.entries(names).map(([k, v]) =>
      `<button class="tab ${sel.tab === k ? 'active' : ''}" data-tab="${k}">${v}${counts[k] !== undefined ? `<span class="n">${counts[k]}</span>` : ''}</button>`).join('');
    $('title').innerHTML = `${h === 'main' ? HUB_ICON : LOCK_ICON} ${esc(h)}`;
    $('subtitle').textContent = h === 'main' ? 'Default hub. Sessions that run /hub without a keyword join here.' : 'Private hub. Only agents in this hub can talk to each other here.';
    body = { agents: () => viewAgents(inHub(h), h), board: () => viewBoard(h), conversations: () => viewConversations(h), tasks: () => viewTasks(h), graph: () => viewGraph(h) }[sel.tab]();
  } else if (sel.scope === 'unassigned') {
    $('title').textContent = 'Unassigned';
    $('subtitle').textContent = 'Agents in no hub. They can’t send or receive messages until you drag them into one.';
    body = viewAgents(S.agents.filter((a) => !a.hubs.length));
  } else {
    $('title').textContent = 'All agents';
    $('subtitle').textContent = 'Every session that has run /hub in this project. Drag a card onto a hub in the sidebar to add it.';
    body = viewAgents(S.agents);
  }
  $('tabs').innerHTML = tabs;
  $('view').innerHTML = body;
  document.querySelectorAll('details[data-id]').forEach((d) => { if (open.has(d.dataset.id)) d.open = true; });
  main.scrollTop = keepScroll;
}

// Don't redraw under the user's pointer mid-drag.
let dragging = false;
document.addEventListener('dragstart', () => { dragging = true; });
document.addEventListener('dragend', () => { dragging = false; if (pending) { S = pending; pending = null; render(); } });
let pending = null;

function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { $('connDot').className = 'dot ok'; $('connText').textContent = 'Live'; };
  es.onmessage = (m) => {
    const next = JSON.parse(m.data);
    if (dragging) { pending = next; return; }
    S = next; render();
  };
  es.onerror = () => { $('connDot').className = 'dot bad'; $('connText').textContent = 'Disconnected · retrying'; };
}
fetch('/api/state').then((r) => r.json()).then((s) => { if (!S) { S = s; render(); } }).catch(() => {});
connect();
setInterval(() => { if (S && !dragging) render(); }, 15000); // refresh "x ago" labels
</script>
</body>
</html>
