      <span>${key('<path d="M2 5h20" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M19 2l3 3-3 3" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>')}Tasks, messages and updates, in the direction they went. Thicker means more.</span>
      <span>${key('<circle cx="13" cy="5" r="4" fill="var(--lime)"/>')}Glowing agents are working now</span>
    </div></div>`;
}

// ---------- main render ----------

const TABS = {
  activity: ['activity', 'Activity', 'Everything, in order'],
  agents: ['users', 'Agents', 'Cards and status'],
  board: ['board', 'Board', 'Post work, see posts'],
  conversations: ['chat', 'Conversations', 'Agent threads, read only'],
  tasks: ['tasks', 'Tasks', 'Who is doing what'],
  graph: ['graph', 'Graph', 'Who talks to whom'],
};

function render(navigated) {
  if (!S) return;
  if (sel.scope.startsWith('hub:') && !S.hubs.includes(scopeHub())) sel.scope = 'hub:main';
  if (sel.agent && !agent(sel.agent)) sel.agent = null;
  document.title = `${S.project} | Session Hub`;
  setHTML($('crumb'), `${ic('chev')}<a href="/">All projects</a>${ic('chev')}<b title="${esc(S.root)}">${esc(S.project)}</b>`);
  renderSide();

  const h = scopeHub();
  const main = $('main');
  const keepScroll = navigated ? 0 : main.scrollTop;
  const open = new Set([...document.querySelectorAll('details[open][data-id]')].map((d) => d.dataset.id));

  let tabs = '', body = '', title = '', subtitle = '';
  if (h) {
    const evs = hubEvents(h);
    const counts = {
      agents: inHub(h).length,
      board: evs.filter((e) => e.type === 'message' && e.to === '*').length + hubWork(h).length,
      conversations: conversations(h).length,
      tasks: S.tasks.filter((t) => t.hub === h).length,
    };
    if (!TABS[sel.tab]) sel.tab = 'activity';
    tabs = Object.entries(TABS).map(([k, [i, name, desc]]) =>
      `<button class="tab ${sel.tab === k ? 'active' : ''}" data-tab="${k}">${ic(i)}<span>${term(`${name}${counts[k] !== undefined ? `<span class="n">${counts[k]}</span>` : ''}`, desc)}</span></button>`).join('');
    title = `${ic(h === 'main' ? 'home' : 'lock')}${HN(h)}`;
    subtitle = h === 'main' ? 'The default hub. Sessions that run /hub without a name join here.' : 'A private hub. Only agents in it can talk to each other.';
    body = { activity: () => viewActivity(h), agents: () => viewAgents(inHub(h), h), board: () => viewBoard(h), conversations: () => viewConversations(h), tasks: () => viewTasks(h), graph: () => viewGraph(h) }[sel.tab]();
  } else if (sel.scope === 'unassigned') {
    title = `${ic('userOut')}Unassigned`;
    subtitle = 'Agents in no hub. They keep running but can’t message other agents until you drag them into a hub.';
    body = viewAgents(S.agents.filter((a) => !a.hubs.length));
  } else {
    title = `${ic('users')}All agents`;
    subtitle = 'Every session that has run /hub in this project. Drag a card onto a hub in the sidebar to add it.';
    body = viewAgents(S.agents);
  }
  setHTML($('tabs'), tabs);
  setHTML($('headActions'), h && h !== 'main' ? `<button class="danger-btn" type="button" data-delete-hub="${esc(h)}">${ic('x')}Delete hub</button>` : '');
  setHTML($('title'), title);
  $('title').title = subtitle;
  const view = $('view');
  if (setHTML(view, body)) {
    document.querySelectorAll('details[data-id]').forEach((d) => { if (open.has(d.dataset.id)) d.open = true; });
    main.scrollTop = keepScroll;
  }
  renderComposer(h);
  // The usage-limit notice sits above everything else on the Board and Activity tabs.
  setHTML($('limitSlot'), h && (sel.tab === 'board' || sel.tab === 'activity') ? limitBanner(h) : '');
  if (navigated) { view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter'); main.scrollTop = 0; }
  renderDrawer();
  placeInks();
}

// The project's hub is gone (wiped, or never set up): say so and point home.
function renderGone() {
  $('conn').className = 'conn bad'; $('connText').textContent = 'Not found';
  setHTML($('crumb'), `${ic('chev')}<a href="/">All projects</a>`);
  setHTML($('title'), `${ic('inbox')}No hub here`);
  setHTML($('tabs'), '');
  setHTML($('headActions'), '');
  $('composerWrap').hidden = true;
  setHTML($('view'), emptyBox('This project has no Session Hub', 'It may have been wiped with /hub-wipe. Run /hub in a session in the project to start a new one, or <a href="/">see all projects</a>.'));
}

// New events glow briefly when they arrive (not on first load).
function noteFresh(next) {
  const ids = new Set(next.events.map((e) => e.id));
  if (seenIds) for (const id of ids) if (!seenIds.has(id)) fresh.set(id, Date.now() + 2600);
  seenIds = ids;
  for (const [id, until] of fresh) if (until < Date.now()) fresh.delete(id);
}

// Don't redraw under the user's pointer mid-drag.
let dragging = false;
let pending = null;
document.addEventListener('dragstart', () => { dragging = true; });
document.addEventListener('dragend', () => { dragging = false; if (pending) { S = pending; pending = null; render(); } });

function accept(next) {
  noteFresh(next);
  if (dragging) { pending = next; return; }
  const firstLoad = !S;
  S = next;
  render(firstLoad);
}

function connect() {
  const es = new EventSource(`${BASE}/stream`);
  es.onopen = () => { $('conn').className = 'conn'; $('connText').textContent = 'Live'; };
  es.onmessage = (m) => accept(JSON.parse(m.data));
  es.addEventListener('gone', () => { es.close(); renderGone(); });
  es.onerror = () => {
    $('conn').className = 'conn bad'; $('connText').textContent = 'Reconnecting';
    fetch(`${BASE}/state`).then((r) => { if (r.status === 404) { es.close(); renderGone(); } }).catch(() => {});
  };
}

$('logo').innerHTML = ic('hubs');
$('newHubBtn').innerHTML = ic('plus');
$('hubsHead').innerHTML = `${ic('hubs')}<div>${term('Hubs', 'Groups of agents that can talk to each other')}</div>`;
$('agentsHead').innerHTML = `${ic('users')}<div>${term('Agents', 'Sessions registered with /hub')}</div>`;
$('composerHead').innerHTML = `${ic('flag')}<div>${term('Post work', 'Describe a feature or job. Only the lead you choose is woken; it splits the work across this hub and reports back here.')}</div>`;
$('leadTerm').innerHTML = term('Lead', 'Plans and delegates');
$('postBtn').innerHTML = `${ic('send')}Post to board`;
$('addImgLabel').innerHTML = `${ic('plus')}Add images`;
initTheme();
fetch(`${BASE}/state`).then((r) => (r.status === 404 ? null : r.json())).then((s) => { if (!s) renderGone(); else if (!S) accept(s); }).catch(() => {});
connect();
setInterval(() => { if (S && !dragging) render(); }, 15000); // refresh "x ago" labels
setInterval(() => { // let glows fade out, then stop
  if (!S || dragging || !fresh.size) return;
  for (const [id, until] of fresh) if (until < Date.now()) fresh.delete(id);
  render();
}, 1000);
if (document.fonts) document.fonts.ready.then(placeInks);
</script>
</body>
</html>
